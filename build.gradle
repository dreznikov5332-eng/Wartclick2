plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Исходник написан на intermediary-именах (class_304, method_1436 и т.д.),
    // поэтому в качестве маппингов берём сам intermediary.
    mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

// Плоская раскладка: исходник и fabric.mod.json лежат прямо в корне репозитория.
sourceSets {
    main {
        java {
            setSrcDirs(['.'])
            include 'WartClickClient.java'
        }
        resources {
            setSrcDirs(['.'])
            include 'fabric.mod.json'
        }
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE")
}
